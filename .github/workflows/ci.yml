name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and format
    # Linting is platform independent, so it runs on the cheaper runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pipx install ruff
      - name: Check formatting
        run: ruff format --check --diff .
      - name: Lint
        run: ruff check --output-format=github .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # MLX is configured as untyped for mypy, so the package type checks
        # without it; numpy is not, and the reference layer, the planner and
        # the tests import it, so it has to be present or every one of those
        # modules is an import error rather than a checked file.
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy pytest numpy
      - name: Mypy
        run: mypy mround tests scripts examples

  test:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 and later are Apple Silicon. Linux is included only to keep
        # the framework-independent layers honest about not needing MLX; it is
        # not a supported platform for MRound itself.
        os: [macos-15, macos-14, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: macos-14
            python-version: "3.12"
          - os: macos-14
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (macOS, with MLX)
        if: startsWith(matrix.os, 'macos')
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install (Linux, without MLX)
        if: startsWith(matrix.os, 'ubuntu')
        # MLX publishes a Linux CPU wheel (pip install 'mlx[cpu]' runs the whole
        # suite, see CLAUDE.md), but this job deliberately leaves it out: its
        # purpose is to prove that the framework-free layers really are
        # framework free, so the MLX-gated tests skip here and run on macOS.
        # numpy is a runtime dependency of those layers, not an MLX one, and
        # --no-deps drops it, so it is installed by name.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov numpy
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: pytest tests/unit -v --cov=mround --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'macos-15' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check that the vendored reference is not packaged
        # The reference implementation is a parity oracle. Shipping it inside an
        # MRound distribution would be both wrong and enormous.
        # The vendored trees live at the repository root as auto-round-*/, so
        # the match is anchored to the root of the archive rather than to the
        # substring.
        run: |
          set -euo pipefail
          if tar tzf dist/*.tar.gz | grep -Eq '^[^/]+/auto-round-'; then
            echo "::error::vendored auto-round leaked into the sdist"
            exit 1
          fi
          echo "sdist is clean"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs-consistency:
    name: Docs and code agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every module in DOCUMENTATION.md section 4 exists
        # DOCUMENTATION.md is authoritative. When it and the tree disagree, the
        # disagreement is resolved rather than tolerated, so it is checked.
        run: python scripts/check_module_layout.py
