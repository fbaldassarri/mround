#
# Install with: pre-commit install
#
# The vendored reference implementation is excluded everywhere. It is a
# development-time parity oracle, read-only, and not ours to reformat.

exclude: '^auto-round-.*/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^(mround|tests|scripts|examples|ubuntu-24\.04)/
        additional_dependencies: [pytest]

  - repo: local
    hooks:
      - id: module-layout
        name: package tree matches DOCUMENTATION.md section 4
        entry: python scripts/check_module_layout.py
        language: system
        pass_filenames: false
        files: ^(mround/.*\.py|DOCUMENTATION\.md)$
